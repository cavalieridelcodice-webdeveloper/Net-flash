<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>NetFlash — Premium Speed Test & Network Quality</title>
    <meta name="description" content="Misura download, upload, ping e jitter con NetFlash. Speed test di precisione, privo di pubblicità, trasparente e basato sul motore open source LibreSpeed." />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#070a14" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- iOS / macOS Safari PWA Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NetFlash" />

    <!-- Windows & Edge PWA Support -->
    <meta name="application-name" content="NetFlash" />
    <meta name="msapplication-TileColor" content="#070a14" />
    <meta name="msapplication-TileImage" content="/android-chrome-512x512.png" />

    <!-- Google Fonts: Outfit (Brand/Headings), Space Grotesk (Metrics/Numbers), Inter (Interface/Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
